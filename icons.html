<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Иконки</title>
<style>
  html, body { margin: 0; background: #0d0d0e; color: #e8e8ea; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { padding: 48px 22px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { color: #9a9aa0; line-height: 1.5; margin: 0 auto; max-width: 420px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Редактор иконок</h1>
  <p>Экран иконок пока не входит в этот репозиторий. Эмодзи и стикеры собираются во вкладке «Эмодзи», готовые паки — во вкладке «Мои паки».</p>
</div>
<script>
  // Родительская страница подстраивает высоту iframe по этому сообщению.
  function reportHeight() {
    try {
      parent.postMessage({ type: "swex-icons-height", height: document.body.scrollHeight || 520 }, location.origin);
    } catch (e) {}
  }
  reportHeight();
  addEventListener("resize", reportHeight);
</script>
</body>
</html>
